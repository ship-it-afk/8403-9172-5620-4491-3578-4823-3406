<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASAS Hyper-AI</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=JetBrains+Mono&display=swap');

        :root {
            --bg-deep: #05070a;
            --glass: rgba(22, 27, 38, 0.7);
            --accent: #00f2ff;
            --accent-glow: rgba(0, 242, 255, 0.3);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --user-bubble: linear-gradient(135deg, #2563eb, #1d4ed8);
            --bot-bubble: rgba(30, 41, 59, 0.5);
            --border: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top right, #101827, var(--bg-deep));
            color: var(--text-main);
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .app-window {
            width: 100%;
            max-width: 1000px;
            height: 90vh;
            background: var(--glass);
            backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid var(--border);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        /* Header Branding */
        .header {
            padding: 20px 30px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { font-size: 14px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; margin: 0; color: var(--accent); }
        .status-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; box-shadow: 0 0 10px #10b981; }

        #chat-box {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            scrollbar-width: thin;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Message Bubbles */
        .msg {
            max-width: 80%;
            padding: 16px 20px;
            border-radius: 20px;
            font-size: 15px;
            line-height: 1.6;
            position: relative;
            animation: slideUp 0.4s ease-out forwards;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .user { align-self: flex-end; background: var(--user-bubble); color: white; border-bottom-right-radius: 4px; box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3); }
        .bot { align-self: flex-start; background: var(--bot-bubble); border: 1px solid var(--border); border-bottom-left-radius: 4px; }

        .img-output {
            width: 100%;
            border-radius: 12px;
            margin-top: 15px;
            border: 1px solid var(--border);
            display: block;
            background: #000;
        }

        /* Input Zone */
        .input-container {
            padding: 24px 30px;
            background: rgba(0, 0, 0, 0.2);
            border-top: 1px solid var(--border);
        }
        .input-wrapper {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            padding: 8px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .input-wrapper:focus-within { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }

        input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            padding: 12px;
            color: white;
            font-family: inherit;
            font-size: 16px;
            outline: none;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-primary { background: var(--accent); color: #000; }
        .btn-primary:hover { transform: scale(1.02); filter: brightness(1.1); }
        
        .file-label {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-dim);
        }
        .file-label:hover { background: rgba(255, 255, 255, 0.1); color: white; }

        /* Typing & Stream Effect */
        .typing::after {
            content: "";
            display: inline-block;
            width: 8px;
            height: 18px;
            background: var(--accent);
            margin-left: 4px;
            vertical-align: middle;
            animation: cursorBlink 0.8s infinite;
        }
        @keyframes cursorBlink { 50% { opacity: 0; } }

        /* Scrollbar */
        #chat-box::-webkit-scrollbar { width: 6px; }
        #chat-box::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    </style>
</head>
<body>

<div class="app-window">
    <div class="header">
        <h1>ASAS Hyper-AI // 2026</h1>
    </div>

    <div id="chat-box">
        <div class="msg bot">
            <b>AI Ready To Use</b><br>
            • Upload a <b>PDF</b> or <b>Docx</b> to analyze instantly.
        </div>
    </div>

    <div class="input-container">
        <form class="input-wrapper" id="chat-form">
            <label class="file-label" title="Upload Document">
                <input type="file" id="file-input" hidden accept=".pdf,.docx">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg>
            </label>
            <input type="text" id="user-input" placeholder="Message ASAS Hyper-AI..." autocomplete="off">
            <button type="submit" class="btn btn-primary">SEND</button>
        </form>
    </div>
</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const chatBox = document.getElementById('chat-box');
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');
    const fileInput = document.getElementById('file-input');

    fileInput.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        addMessage(`📂 ARCHIVE_INJECTED: ${file.name}`, 'user');
        const botMsg = addMessage("Decrypting data clusters...", 'bot typing');
        
        try {
            let text = "";
            const arrayBuffer = await file.arrayBuffer();
            if (file.name.endsWith('.pdf')) {
                const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const content = await page.getTextContent();
                    text += content.items.map(s => s.str).join(" ") + " ";
                }
            } else {
                const res = await mammoth.extractRawText({arrayBuffer});
                text = res.value;
            }
            botMsg.innerText = "Context loaded. Analyzing metadata...";
            botMsg.classList.remove('typing');
            
            // Immediate Summary Trigger
            userInput.value = `[DOCUMENT_CONTEXT: ${text.substring(0, 6000)}] \n\n Action: Summarize key findings.`;
            chatForm.dispatchEvent(new Event('submit'));
        } catch (err) { botMsg.innerText = "SIGNAL_LOST: Error reading file."; }
    };

    chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = userInput.value.trim();
        if (!text) return;

        addMessage(text, 'user');
        userInput.value = '';

        if (text.startsWith('/draw ')) {
            const prompt = text.replace('/draw ', '');
            const botMsg = addMessage(`Neural Synthesis: "${prompt}"...`, 'bot');
            const img = document.createElement('img');
            img.className = 'img-output';
            // Added modern nologo and high-fidelity params
            img.src = `https://pollinations.ai/p/${encodeURIComponent(prompt)}?width=1024&height=1024&seed=${Math.floor(Math.random()*10000)}&nologo=true&enhance=true`;
            botMsg.appendChild(img);
            return;
        }

        const botMsgDiv = addMessage("", 'bot typing');
        try {
            // Updated to use the faster openai-fast model for 2026 responsiveness
            const response = await fetch(`https://text.pollinations.ai/openai-fast/${encodeURIComponent(text)}?stream=true`);
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let aiText = "";

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                
                const chunk = decoder.decode(value);
                const lines = chunk.split('\n');
                for (const line of lines) {
                    if (line.startsWith('data: ')) {
                        try {
                            const data = JSON.parse(line.slice(6));
                            const content = data.choices[0].delta.content || "";
                            aiText += content;
                            botMsgDiv.innerText = aiText;
                            chatBox.scrollTop = chatBox.scrollHeight;
                        } catch (e) {}
                    }
                }
            }
        } catch (err) { botMsgDiv.innerText = "CONNECTION_INTERRUPTED."; }
        botMsgDiv.classList.remove('typing');
    });

    function addMessage(text, className) {
        const div = document.createElement('div');
        div.className = `msg ${className}`;
        div.innerText = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
        return div;
    }
</script>
</body>
</html>
