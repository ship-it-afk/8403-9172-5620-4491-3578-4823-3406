<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASAS Hyper-AI 3.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f8fafc;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --sidebar-color: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --accent-primary: #6366f1;
            --gemini-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            --border-subtle: rgba(0, 0, 0, 0.05);
            --shadow-soft: 0 4px 20px -5px rgba(0,0,0,0.05);
            --chat-font-size: 17px;
            --bubble-ai: #ffffff;
            --bubble-user: #f1f5f9;
            --input-bg: rgba(255, 255, 255, 0.85);
        }

        /* DARK MODE OVERRIDES */
        [data-theme="dark"] {
            --bg-color: #020617;
            --glass-bg: rgba(15, 23, 42, 0.8);
            --sidebar-color: #0f172a;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --shadow-soft: 0 10px 30px -10px rgba(0,0,0,0.5);
            --bubble-ai: #1e293b;
            --bubble-user: #334155;
            --input-bg: rgba(30, 41, 59, 0.8);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.1) 0, transparent 50%), 
                              radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.1) 0, transparent 50%);
            color: var(--text-main);
            margin: 0; display: flex; height: 100vh; overflow: hidden;
            transition: background-color 0.3s ease;
        }

        .sidebar {
            width: 280px; background: var(--sidebar-color); border-right: 1px solid var(--border-subtle);
            display: flex; flex-direction: column; padding: 24px 16px; z-index: 20;
            transition: background 0.3s ease;
        }

        .new-chat {
            display: flex; align-items: center; gap: 12px; padding: 14px 20px;
            background: var(--text-main); color: var(--bg-color); border-radius: 16px;
            font-weight: 500; cursor: pointer; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            margin-bottom: 32px; transition: transform 0.2s;
        }
        .new-chat:hover { transform: translateY(-2px); filter: brightness(1.2); }

        .settings-panel {
            position: fixed; right: -350px; top: 0; bottom: 0; width: 320px;
            background: var(--glass-bg); backdrop-filter: blur(25px);
            border-left: 1px solid var(--border-subtle); z-index: 100; padding: 30px;
            transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: -10px 0 30px rgba(0,0,0,0.05);
        }
        .settings-panel.open { right: 0; }
        .settings-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .setting-item { margin-bottom: 24px; }
        .setting-item label { display: block; font-size: 11px; font-weight: 700; color: var(--text-sub); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
        .setting-item select, .setting-item input[type="range"] { width: 100%; }
        .setting-item select { padding: 10px; border-radius: 10px; border: 1px solid var(--border-subtle); background: var(--sidebar-color); color: var(--text-main); font-family: inherit; outline: none; }

        /* Theme Toggle Button */
        .theme-toggle {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px; border-radius: 12px; border: 1px solid var(--border-subtle);
            background: var(--sidebar-color); cursor: pointer; margin-bottom: 24px;
        }

        .main-container { flex: 1; display: flex; flex-direction: column; position: relative; }
        .top-nav {
            padding: 20px 40px; display: flex; justify-content: space-between; align-items: center;
            backdrop-filter: blur(10px); background: var(--glass-bg); border-bottom: 1px solid var(--border-subtle);
        }

        .chat-viewport { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
        .chat-container { max-width: 850px; margin: 0 auto; padding: 40px 20px 250px 20px; }

        .welcome-section { text-align: left; margin-top: 15vh; }
        .greeting { font-size: 64px; font-weight: 600; letter-spacing: -2px; margin: 0; background: var(--gemini-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .sub-greeting { font-size: 64px; color: var(--text-sub); opacity: 0.4; margin: 0; font-weight: 600; letter-spacing: -2px; }

        .entry { margin-bottom: 40px; animation: slideIn 0.5s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } }
        .role-header { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 12px; text-transform: uppercase; color: var(--text-sub); margin-bottom: 12px; }
        .ai-icon { background: var(--gemini-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-variation-settings: 'FILL' 1; }
        
        .content-body { 
            font-size: var(--chat-font-size); line-height: 1.8; color: var(--text-main); 
            background: var(--bubble-ai); padding: 24px; border-radius: 24px; 
            box-shadow: var(--shadow-soft); border: 1px solid var(--border-subtle); 
            transition: background 0.3s ease;
        }
        .user-entry .content-body { background: var(--bubble-user); border: none; box-shadow: none; width: fit-content; max-width: 80%; margin-left: auto; }
        .user-entry .role-header { justify-content: flex-end; }

        .input-area { position: absolute; bottom: 30px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; padding: 0 20px; }
        .input-wrapper { 
            width: 100%; max-width: 800px; background: var(--input-bg); 
            backdrop-filter: blur(20px); border: 1px solid var(--border-subtle); 
            border-radius: 28px; padding: 12px 16px; display: flex; align-items: flex-end; gap: 12px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.08); 
        }
        textarea { flex: 1; background: transparent; border: none; outline: none; padding: 12px 0; font-family: inherit; font-size: 16px; resize: none; max-height: 200px; color: var(--text-main); }
        
        .icon-btn { width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-sub); transition: all 0.2s; }
        .icon-btn:hover { background: var(--bubble-user); color: var(--accent-primary); }
        .send-btn { background: var(--text-main); color: var(--bg-color) !important; border-radius: 50%; opacity: 0.2; pointer-events: none; }
        .send-btn.active { opacity: 1; pointer-events: all; }

        .quick-actions { display: flex; gap: 10px; margin-top: 15px; width: 100%; max-width: 800px; }
        .action-chip { 
            padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border-subtle); 
            background: var(--sidebar-color); font-size: 13px; font-weight: 500; color: var(--text-sub); 
            cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 6px;
        }
        .action-chip:hover { background: var(--bubble-user); border-color: var(--accent-primary); color: var(--accent-primary); }

        .streaming::after { content: ""; display: inline-block; width: 8px; height: 18px; background: var(--accent-primary); margin-left: 5px; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body data-theme="light">

    <aside class="sidebar">
        <div class="new-chat" onclick="location.reload()">
            <span class="material-symbols-rounded">add_circle</span>
            <span>New Session</span>
        </div>
        <div id="history-list" style="flex: 1; overflow-y: auto;">
            <p style="font-size: 11px; color: var(--text-sub); padding-left: 10px; letter-spacing: 1px;">HISTORY</p>
        </div>
    </aside>

    <div class="settings-panel" id="settings-panel">
        <div class="settings-header">
            <h3 style="margin:0">System Preferences</h3>
            <div class="icon-btn" onclick="toggleSettings()"><span class="material-symbols-rounded">close</span></div>
        </div>

        <div class="setting-item">
            <label>Appearance</label>
            <div class="theme-toggle" onclick="toggleTheme()">
                <span id="theme-text">Switch to Dark Mode</span>
                <span class="material-symbols-rounded" id="theme-icon">dark_mode</span>
            </div>
        </div>
        
        <div class="setting-item">
            <label>Creativity Level: <span id="temp-val">0.7</span></label>
            <input type="range" id="setting-temp" min="0" max="1" step="0.1" value="0.7">
        </div>

        <div class="setting-item">
            <label>Interface Font Size</label>
            <select id="setting-font">
                <option value="15px">Small (15px)</option>
                <option value="17px" selected>Default (17px)</option>
                <option value="20px">Reading Mode (20px)</option>
            </select>
        </div>

        <div class="setting-item">
            <label>AI Processing Engine</label>
            <select id="setting-model">
                <option value="openai-fast">Hyper-Fast (Turbo)</option>
                <option value="openai">Precise (Balanced)</option>
            </select>
        </div>
        
        <button onclick="saveSettings()" style="width:100%; padding:12px; border:none; border-radius:12px; background:var(--accent-primary); color:white; font-weight:600; cursor:pointer;">Apply Changes</button>
    </div>

    <main class="main-container">
        <nav class="top-nav">
            <div style="font-size: 16px; font-weight: 600; color: var(--text-main); display: flex; align-items: center; gap: 8px;">
                <span class="material-symbols-rounded ai-icon" style="font-size: 28px;">auto_awesome</span>
                ASAS Hyper-AI
            </div>
            <div class="icon-btn" onclick="toggleSettings()"><span class="material-symbols-rounded">settings</span></div>
        </nav>

        <div class="chat-viewport" id="viewport">
            <div class="chat-container">
                <div id="welcome-view" class="welcome-section">
                    <h1 class="greeting">Modern Intelligence.</h1>
                    <h1 class="sub-greeting">What should we dive in?</h1>
                </div>
                <div id="chat-history"></div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <label class="icon-btn" title="Context Link">
                    <input type="file" id="file-input" hidden accept=".pdf,.docx">
                    <span class="material-symbols-rounded">attachment</span>
                </label>
                <textarea id="user-input" placeholder="Message Hyper-AI..." rows="1" autocomplete="off"></textarea>
                <div class="action-btns">
                    <div id="send-btn" class="icon-btn send-btn"><span class="material-symbols-rounded">arrow_upward</span></div>
                    <div id="stop-btn" class="icon-btn" style="display:none; color: #ef4444;"><span class="material-symbols-rounded">stop_circle</span></div>
                </div>
            </div>

            <div class="quick-actions">
                <div class="action-chip" onclick="handleLearnClick()">
                    <span class="material-symbols-rounded">school</span> Help me learn
                </div>
                <div class="action-chip" onclick="handleBoostClick()">
                    <span class="material-symbols-rounded">bolt</span> Boost my day
                </div>
            </div>
        </div>
    </main>

<script>
    // --- THEME LOGIC ---
    function toggleTheme() {
        const body = document.body;
        const currentTheme = body.getAttribute('data-theme');
        const newTheme = currentTheme === 'light' ? 'dark' : 'light';
        body.setAttribute('data-theme', newTheme);
        
        const text = document.getElementById('theme-text');
        const icon = document.getElementById('theme-icon');
        
        text.innerText = newTheme === 'light' ? 'Switch to Dark Mode' : 'Switch to Light Mode';
        icon.innerText = newTheme === 'light' ? 'dark_mode' : 'light_mode';
        
        localStorage.setItem('hyper_ai_theme', newTheme);
    }

    // --- CORE AI INTERFACE LOGIC ---
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    
    const elements = {
        history: document.getElementById('chat-history'),
        welcome: document.getElementById('welcome-view'),
        input: document.getElementById('user-input'),
        send: document.getElementById('send-btn'),
        stop: document.getElementById('stop-btn'),
        viewport: document.getElementById('viewport'),
        file: document.getElementById('file-input'),
        settings: document.getElementById('settings-panel'),
        tempRange: document.getElementById('setting-temp'),
        tempLabel: document.getElementById('temp-val'),
        fontSelect: document.getElementById('setting-font'),
        modelSelect: document.getElementById('setting-model')
    };

    let docContext = "";
    let currentAbortController = null;

    function handleLearnClick() {
        elements.input.placeholder = "What do you want to learn?";
        elements.input.focus();
    }

    function handleBoostClick() {
        elements.input.value = "Boost my day";
        elements.input.dispatchEvent(new Event('input'));
        elements.input.focus();
    }

    function loadSettings() {
        const saved = JSON.parse(localStorage.getItem('hyper_ai_settings') || '{}');
        const savedTheme = localStorage.getItem('hyper_ai_theme') || 'light';
        
        if (savedTheme === 'dark') toggleTheme();

        if(saved.temp) {
            elements.tempRange.value = saved.temp;
            elements.tempLabel.innerText = saved.temp;
        }
        if(saved.font) {
            elements.fontSelect.value = saved.font;
            document.documentElement.style.setProperty('--chat-font-size', saved.font);
        }
        if(saved.model) {
            elements.modelSelect.value = saved.model;
        }
    }

    function saveSettings() {
        const config = {
            temp: elements.tempRange.value,
            font: elements.fontSelect.value,
            model: elements.modelSelect.value
        };
        localStorage.setItem('hyper_ai_settings', JSON.stringify(config));
        document.documentElement.style.setProperty('--chat-font-size', config.font);
        toggleSettings();
        addMessage("AI", "✅ System preferences updated and saved locally.");
    }

    elements.tempRange.oninput = (e) => elements.tempLabel.innerText = e.target.value;

    function toggleSettings() {
        elements.settings.classList.toggle('open');
    }

    elements.input.addEventListener('input', () => {
        elements.input.style.height = 'auto';
        elements.input.style.height = elements.input.scrollHeight + 'px';
        elements.send.classList.toggle('active', elements.input.value.trim().length > 0);
    });

    function toggleInputState(isThinking) {
        elements.send.style.display = isThinking ? 'none' : 'flex';
        elements.stop.style.display = isThinking ? 'flex' : 'none';
        if (!isThinking) elements.send.classList.remove('active');
    }

    function addMessage(role, text = "", isStreaming = false) {
        elements.welcome.style.display = 'none';
        const entry = document.createElement('div');
        const isUser = role === 'You';
        entry.className = `entry ${isUser ? 'user-entry' : 'ai-entry'}`;
        
        entry.innerHTML = `
            <div class="role-header">
                ${!isUser ? '<span class="material-symbols-rounded ai-icon">auto_awesome</span>' : ''}
                ${isUser ? 'Request' : 'Hyper-AI'}
            </div>
            <div class="content-body ${isStreaming ? 'streaming' : ''}"></div>
        `;
        
        elements.history.appendChild(entry);
        const body = entry.querySelector('.content-body');
        if (isUser) body.innerText = text;
        else if (text) body.innerHTML = marked.parse(text);
        elements.viewport.scrollTo({ top: elements.viewport.scrollHeight, behavior: 'smooth' });
        return body;
    }

    async function runQuery(text) {
        toggleInputState(true);
        const botDiv = addMessage("AI", "", true);
        currentAbortController = new AbortController();
        const config = JSON.parse(localStorage.getItem('hyper_ai_settings') || '{"model":"openai-fast","temp":"0.7"}');
        
        try {
            const finalPrompt = docContext + text;
            const url = `https://text.pollinations.ai/${config.model}/${encodeURIComponent(finalPrompt)}?stream=true&model=openai&temperature=${config.temp}`;
            const response = await fetch(url, { signal: currentAbortController.signal });
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let fullText = "";

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                const chunk = decoder.decode(value);
                const lines = chunk.split('\n');
                for (const line of lines) {
                    if (line.startsWith('data: ')) {
                        try {
                            const data = JSON.parse(line.slice(6));
                            fullText += data.choices[0].delta.content || "";
                            botDiv.innerHTML = marked.parse(fullText);
                            elements.viewport.scrollTop = elements.viewport.scrollHeight;
                        } catch (e) {}
                    }
                }
            }
        } catch (err) {
            if (err.name !== 'AbortError') botDiv.innerText = "System connection interrupted.";
        } finally {
            botDiv.classList.remove('streaming');
            toggleInputState(false);
        }
    }

    elements.send.onclick = () => {
        const val = elements.input.value.trim();
        if (!val) return;
        addMessage("You", val);
        elements.input.value = "";
        elements.input.style.height = 'auto';
        elements.input.placeholder = "Message Hyper-AI...";
        runQuery(val);
    };

    elements.input.onkeydown = (e) => {
        if (e.key === 'Enter' && !e.shiftKey && elements.send.classList.contains('active')) {
            e.preventDefault();
            elements.send.click();
        }
    };
    
    elements.stop.onclick = () => currentAbortController?.abort();

    elements.file.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        addMessage("You", `Upload Context: ${file.name}`);
        const status = addMessage("AI", "Synthesizing document data...", true);
        try {
            let text = "";
            const buf = await file.arrayBuffer();
            if (file.name.endsWith('.pdf')) {
                const pdf = await pdfjsLib.getDocument({data: buf}).promise;
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const content = await page.getTextContent();
                    text += content.items.map(s => s.str).join(" ") + " ";
                }
            } else {
                const res = await mammoth.extractRawText({arrayBuffer: buf});
                text = res.value;
            }
            docContext = `[DOC_CONTEXT: ${text.substring(0, 7000)}] `;
            status.innerHTML = marked.parse("**Knowledge updated.** I am now grounded in the provided document.");
            status.classList.remove('streaming');
        } catch (err) { status.innerText = "Failed to process document."; }
    };

    loadSettings();

    // --- GLASS CURSOR INJECTION ---
    (function() {
        const style = document.createElement('style');
        style.innerHTML = `
            * { cursor: none !important; }
            .glass-cursor-active { text-decoration: none !important; position: relative; }
            @keyframes cursorClick {
                0% { transform: translate(-50%, -50%) scale(1); }
                50% { transform: translate(-50%, -50%) scale(0.85, 1.15); }
                100% { transform: translate(-50%, -50%) scale(1); }
            }
        `;
        document.head.appendChild(style);

        const cursor = document.createElement('div');
        const trailCount = 6;
        const trails = [];

        const baseGlass = {
            position: 'fixed',
            top: '0',
            left: '0',
            pointerEvents: 'none',
            zIndex: 999999,
            borderRadius: '50%',
            backdropFilter: 'blur(12px) saturate(180%)',
            WebkitBackdropFilter: 'blur(12px) saturate(180%)',
            border: '1px solid rgba(255, 255, 255, 0.4)',
            background: 'linear-gradient(135deg, rgba(255,255,255,0.15), rgba(255,255,255,0.05))',
            boxShadow: '0 8px 32px 0 rgba(31, 38, 135, 0.2), inset 0 0 10px rgba(255,255,255,0.2)',
            transition: 'width 0.3s cubic-bezier(0.23, 1, 0.32, 1), height 0.3s cubic-bezier(0.23, 1, 0.32, 1), border-radius 0.3s ease, background 0.3s ease',
            transform: 'translate(-50%, -50%)'
        };

        Object.assign(cursor.style, baseGlass, {
            width: '40px',
            height: '40px',
            mixBlendMode: 'exclusion'
        });

        document.body.appendChild(cursor);

        for (let i = 0; i < trailCount; i++) {
            const t = document.createElement('div');
            Object.assign(t.style, baseGlass, {
                width: '40px',
                height: '40px',
                opacity: (1 - (i / trailCount)) * 0.5,
                border: 'none',
                background: 'rgba(255,255,255,0.03)',
                zIndex: 999998 - i
            });
            document.body.appendChild(t);
            trails.push({ el: t, x: 0, y: 0 });
        }

        let mouse = { x: 0, y: 0 };
        let pos = { x: 0, y: 0 };
        let isHoveringLink = false;
        let linkRect = null;

        document.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;

            const target = e.target;
            const isText = target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable || getComputedStyle(target).cursor === 'text';
            const isLink = target.closest('a') || target.closest('button') || target.closest('.icon-btn') || target.closest('.action-chip') || target.closest('.new-chat') || target.closest('.theme-toggle');

            if (isText) {
                cursor.style.width = '2px';
                cursor.style.height = '30px';
                cursor.style.borderRadius = '0px';
                cursor.style.background = 'white';
            } else if (isLink) {
                isHoveringLink = true;
                const activeLink = (target.closest('a') || target.closest('button') || target.closest('.icon-btn') || target.closest('.action-chip') || target.closest('.new-chat') || target.closest('.theme-toggle'));
                linkRect = activeLink.getBoundingClientRect();
                cursor.style.width = `${linkRect.width + 10}px`;
                cursor.style.height = '2px';
                cursor.style.borderRadius = '2px';
                cursor.style.background = 'rgba(255,255,255,0.8)';
            } else {
                isHoveringLink = false;
                cursor.style.width = '40px';
                cursor.style.height = '40px';
                cursor.style.borderRadius = '50%';
                cursor.style.background = baseGlass.background;
            }
        });

        document.addEventListener('mousedown', () => {
            cursor.style.transform = 'translate(-50%, -50%) scale(0.7)';
            cursor.style.background = 'rgba(255,255,255,0.4)';
        });

        document.addEventListener('mouseup', () => {
            cursor.style.transform = 'translate(-50%, -50%) scale(1)';
            cursor.style.background = isHoveringLink ? 'rgba(255,255,255,0.8)' : baseGlass.background;
        });

        function update() {
            const speed = 0.15;
            if (isHoveringLink && linkRect) {
                pos.x += (linkRect.left + linkRect.width / 2 - pos.x) * speed;
                pos.y += (linkRect.bottom - pos.y) * speed;
            } else {
                pos.x += (mouse.x - pos.x) * speed;
                pos.y += (mouse.y - pos.y) * speed;
            }

            cursor.style.left = `${pos.x}px`;
            cursor.style.top = `${pos.y}px`;

            trails.forEach((t, i) => {
                const prev = i === 0 ? pos : trails[i - 1];
                const trailSpeed = 0.2 + (i * 0.05);
                t.x += (prev.x - t.x) * trailSpeed;
                t.y += (prev.y - t.y) * trailSpeed;
                t.el.style.left = `${t.x}px`;
                t.el.style.top = `${t.y}px`;
                t.el.style.width = cursor.style.width;
                t.el.style.height = cursor.style.height;
                t.el.style.borderRadius = cursor.style.borderRadius;
            });
            requestAnimationFrame(update);
        }
        update();
    })();
</script>
</body>
</html>
