<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battery Experience</title>

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<!-- GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background:#0b0f2a;
  color:white;
  overflow-x:hidden;
}

/* Sections */
.section {
  height:100vh;
  position:relative;
}

/* HERO */
.hero {
  display:flex;
  align-items:center;
  background:
    linear-gradient(to right, #0b0f2a 30%, transparent 70%),
    url("image2.png") right center/cover no-repeat;
}

.hero-text {
  margin-left:8%;
  font-size:3rem;
  opacity:0;
}

/* 3D */
model-viewer {
  width:100%;
  height:100%;
  opacity:0;
}

/* 🚗 CAR GROUP (important) */
.car-group {
  position:fixed;
  bottom:10%;
  right:-350px;
  width:280px;
}

/* Car image */
.car {
  width:100%;
  display:block;
}

/* Attached image */
.fly {
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%) scale(0.2);
  width:160px;
  opacity:0;
}

/* TEXT */
.text {
  position:fixed;
  right:5%;
  top:40%;
  max-width:400px;
  opacity:0;
  transform:translateX(120px);
}
.text h1 {
  font-size:3rem;
}

/* FINAL */
.final {
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

button {
  margin-top:20px;
  padding:12px 30px;
  border:none;
  border-radius:30px;
  background:#ffcc00;
  cursor:pointer;
}

/* MOBILE */
@media(max-width:768px){
  .hero-text {font-size:2rem;}
  .car-group {width:200px;}
}
</style>
</head>

<body>

<!-- HERO -->
<section class="section hero">
  <div class="hero-text">Battery is energy</div>
</section>

<!-- 3D -->
<section class="section">
  <model-viewer id="model"
    src="3d.glb"
    camera-controls
    auto-rotate
    interaction-prompt="auto">
  </model-viewer>
</section>

<!-- SCROLL SECTIONS -->
<section class="section"></section>
<section class="section"></section>

<!-- FINAL -->
<section class="section final">
  <h1>Thanks</h1>
  <button onclick="window.location.href='https://google.com'">Rate</button>
</section>

<!-- 🚗 CAR + IMAGE GROUP -->
<div class="car-group" id="carGroup">
  <img src="https://cdn-icons-png.flaticon.com/512/743/743922.png" class="car">
  <img src="image1.png" class="fly" id="fly">
</div>

<!-- TEXT -->
<div class="text" id="text">
  <h1>Solar-powered</h1>
  <p>Clean renewable energy powering the future with efficiency and sustainability.</p>
</div>

<script>
gsap.registerPlugin(ScrollTrigger);

/* HERO */
gsap.to(".hero-text", {
  opacity:1,
  y:-20,
  duration:1.5,
  ease:"power3.out"
});

/* 3D */
gsap.to("#model", {
  opacity:1,
  scrollTrigger:{
    trigger:"#model",
    start:"top 80%"
  }
});

/* MASTER TIMELINE */
let tl = gsap.timeline({
  scrollTrigger:{
    trigger:".section:nth-child(3)",
    start:"top top",
    end:"+=3000",
    scrub:1.5,
    pin:true
  }
});

/* 🚗 ENTER */
tl.to("#carGroup", {
  right:"50%",
  x:"50%",
  duration:2,
  ease:"power4.out"
});

/* ✨ IMAGE APPEARS (stays attached) */
tl.to("#fly", {
  opacity:1,
  scale:0.5,
  duration:1.5,
  ease:"back.out(1.7)"
}, "-=1");

/* 🚗 MOVE LEFT */
tl.to("#carGroup", {
  left:"5%",
  right:"auto",
  x:0,
  duration:2,
  ease:"power3.inOut"
});

/* 📝 TEXT IN */
tl.to("#text", {
  opacity:1,
  x:0,
  duration:1.5,
  ease:"power2.out"
}, "-=1");

/* 🚗 EXIT */
tl.to("#carGroup", {
  left:"-400px",
  duration:2,
  ease:"power4.in"
});

/* FINAL */
gsap.from(".final h1", {
  opacity:0,
  y:50,
  scrollTrigger:{
    trigger:".final",
    start:"top 80%"
  }
});
</script>

</body>
</html>
