<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Battery Experience</title>

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background:#0b0f2a;
  color:white;
  overflow-x:hidden;
}

/* Sections */
.section {
  height:100vh;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* HERO */
.hero {
  background:
    linear-gradient(to right, #0b0f2a 30%, transparent 70%),
    url("image2.png") right center/cover no-repeat;
}

.hero-text {
  position:absolute;
  left:8%;
  font-size:3rem;
  opacity:0;
  transform:translateY(50px);
  transition:1.5s ease;
}
.hero-text.show {
  opacity:1;
  transform:translateY(0);
}

/* 3D */
model-viewer {
  width:80%;
  height:80%;
  opacity:0;
  transition:1s;
}
model-viewer.show {
  opacity:1;
}

/* CAR */
.car {
  position:absolute;
  width:300px;
  right:-400px;
  transition:2s ease;
}
.car.center {
  right:50%;
  transform:translateX(50%);
}
.car.left {
  right:auto;
  left:5%;
}
.car.exit {
  left:-400px;
}

/* FLOAT IMAGE */
.fly {
  position:absolute;
  width:200px;
  opacity:0;
  transform:scale(0.2);
  transition:1.5s ease;
}
.fly.show {
  opacity:1;
  transform:scale(0.5);
}

/* TEXT BLOCK */
.text {
  position:absolute;
  right:5%;
  max-width:400px;
  opacity:0;
  transform:translateX(120px);
  transition:1.5s;
}
.text.show {
  opacity:1;
  transform:translateX(0);
}

.text h1 {
  font-size:3rem;
}

/* FINAL */
.final {
  flex-direction:column;
}
.final h1 {
  font-size:3rem;
}

button {
  margin-top:20px;
  padding:12px 30px;
  border:none;
  border-radius:30px;
  background:#ffcc00;
  cursor:pointer;
}

/* MOBILE */
@media(max-width:768px){
  .hero-text {font-size:2rem;}
  .car {width:200px;}
}
</style>
</head>

<body>

<!-- HERO -->
<section class="section hero">
  <div class="hero-text" id="heroText">Battery is energy</div>
</section>

<!-- 3D -->
<section class="section">
  <model-viewer id="model"
    src="3d.glb"
    camera-controls
    auto-rotate
    interaction-prompt="auto"
    touch-action="pan-y">
  </model-viewer>
</section>

<!-- CAR CENTER + IMAGE -->
<section class="section">
  <img src="https://cdn-icons-png.flaticon.com/512/743/743922.png" class="car" id="car1">
  <img src="image1.png" class="fly" id="flyImg">
</section>

<!-- TEXT + CAR LEFT -->
<section class="section">
  <img src="https://cdn-icons-png.flaticon.com/512/743/743922.png" class="car" id="car2">
  <div class="text" id="text">
    <h1>Solar-powered</h1>
    <p>
      Clean renewable energy powering the next generation of mobility.
      Efficient, sustainable and future-ready.
    </p>
  </div>
</section>

<!-- FINAL -->
<section class="section final">
  <h1>Thanks</h1>
  <button onclick="window.location.href='https://google.com'">Rate</button>
</section>

<script>

// HERO LOAD
window.onload = () => {
  heroText.classList.add("show");
};

// OBSERVER
const observer = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{
    if(e.isIntersecting){

      if(e.target.id === "model"){
        model.classList.add("show");
      }

      if(e.target.id === "car1"){
        car1.classList.add("center");
        flyImg.classList.add("show");
      }

      if(e.target.id === "text"){
        car2.classList.add("left");
        text.classList.add("show");
      }

      if(e.target.id === "finalTrigger"){
        car2.classList.add("exit");
      }

    }
  });
},{threshold:0.5});

// Observe elements
observer.observe(document.getElementById("model"));
observer.observe(document.getElementById("car1"));
observer.observe(document.getElementById("text"));

</script>

</body>
</html>
