<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Dictionary Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #818cf8;
            --accent: #10b981;
            --bg: #f8fafc;
            --glass: rgba(255, 255, 255, 0.8);
            --border: #e2e8f0;
            --text: #0f172a;
            --card-inner: #ffffff;
            --input-bg: #f1f5f9;
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --glass: rgba(30, 41, 59, 0.8);
            --border: #334155;
            --text: #f1f5f9;
            --card-inner: #1e293b;
            --input-bg: #334155;
        }

        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; transition: background 0.3s ease, border-color 0.3s ease; }

        body {
            margin: 0; padding: 0;
            background: var(--bg);
            height: 100vh;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }

        /* Sidebar Styling */
        .sidebar {
            position: fixed; left: -280px; top: 0; width: 280px; height: 100%;
            background: var(--glass); backdrop-filter: blur(20px);
            border-right: 1px solid var(--border); z-index: 1000;
            transition: left 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 20px; display: flex; flex-direction: column; gap: 15px;
        }
        .sidebar.open { left: 0; }
        .sidebar-header { font-weight: 700; color: var(--primary); font-size: 1.2rem; margin: 20px 0 10px 0; }
        
        .sidebar-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.2); 
            display: none; z-index: 999; backdrop-filter: blur(2px);
        }
        .sidebar-overlay.active { display: block; }

        .menu-toggle {
            position: absolute; left: 20px; top: 20px;
            background: var(--glass); border: 1px solid var(--border);
            padding: 10px; border-radius: 12px; cursor: pointer; z-index: 1001;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); color: var(--text);
        }

        .sidebar-btn {
            width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--border);
            background: var(--card-inner); color: var(--text); font-weight: 600;
            cursor: pointer; text-align: left; display: flex; align-items: center; gap: 10px;
        }
        .sidebar-btn:hover { background: var(--primary); color: white; }

        .history-list {
            flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
            margin-top: 10px; padding-right: 5px;
        }
        .history-item {
            padding: 10px; border-radius: 8px; background: rgba(0,0,0,0.03);
            font-size: 14px; cursor: pointer; color: var(--text);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .history-item:hover { background: var(--primary-light); color: white; }

        .dark-mode-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px; background: var(--card-inner); border-radius: 12px;
            color: var(--text); font-weight: 600; margin-top: auto;
        }

        /* --- Main UI --- */
        .chat-container {
            width: 95%; max-width: 600px; height: 90vh;
            background: var(--glass); backdrop-filter: blur(12px);
            border: 1px solid var(--border); border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08);
            display: flex; flex-direction: column; overflow: hidden;
            animation: containerIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes containerIn { from { opacity: 0; transform: scale(0.95) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }

        header { padding: 24px; text-align: center; background: rgba(255, 255, 255, 0.1); border-bottom: 1px solid var(--border); }
        h2 { margin: 0; font-weight: 700; color: var(--primary); letter-spacing: -0.5px; }

        #chat-box { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }

        .message-wrapper {
            max-width: 85%; padding: 16px 20px; border-radius: 20px; font-size: 15px; line-height: 1.6;
            animation: msgIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; position: relative;
        }

        @keyframes msgIn { from { opacity: 0; transform: translateY(15px) scale(0.9); } to { opacity: 1; transform: translateY(0) scale(1); } }

        .user-message-wrapper { align-self: flex-end; background: var(--primary); color: white; border-bottom-right-radius: 4px; box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3); }
        
        .ai-message-wrapper { 
            align-self: flex-start; background: var(--card-inner); color: var(--text); 
            border-bottom-left-radius: 4px; border: 1px solid var(--border); 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            padding-bottom: 40px; /* Space for copy button */
        }

        /* Copy Button Styling */
        .copy-btn {
            position: absolute; right: 12px; bottom: 8px;
            background: var(--input-bg); border: 1px solid var(--border);
            color: var(--text); padding: 4px 8px; border-radius: 8px;
            font-size: 11px; cursor: pointer; font-weight: 600;
            display: flex; align-items: center; gap: 4px;
            transition: 0.2s; opacity: 0.8;
        }
        .copy-btn:hover { opacity: 1; background: var(--primary-light); color: white; }

        .input-area { padding: 24px; background: var(--card-inner); border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 12px; }

        input { width: 100%; padding: 16px 20px; border-radius: 16px; border: 2px solid var(--border); font-size: 16px; outline: none; background: var(--input-bg); color: var(--text); }
        input:focus { background: var(--card-inner); border-color: var(--primary); }

        button#send-btn { width: 100%; padding: 16px; border-radius: 16px; background: var(--primary); color: white; font-weight: 600; border: none; cursor: pointer; }

        /* Results UI */
        .word-title { font-size: 1.5rem; color: var(--text); display: block; margin-bottom: 4px; font-weight: 700; }
        .type-tag { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--primary); font-weight: 800; background: #e0e7ff; padding: 4px 8px; border-radius: 6px; margin-bottom: 12px; display: inline-block; }

        details { border: 1px solid var(--border); border-radius: 12px; margin-top: 10px; overflow: hidden; background: var(--card-inner); }
        summary { padding: 14px; cursor: pointer; list-style: none; font-weight: 600; font-size: 14px; display: flex; justify-content: space-between; align-items: center; color: var(--text); }
        summary::after { content: '+'; color: var(--primary); }
        details[open] summary::after { content: '×'; }

        .details-content { padding: 16px; background: var(--card-inner); border-top: 1px solid var(--border); color: var(--text); }
        .example-card { border-left: 4px solid var(--accent); background: rgba(16, 185, 129, 0.1); padding: 12px; border-radius: 0 8px 8px 0; margin: 12px 0; font-style: italic; color: var(--text); }
        
        audio { width: 100%; height: 32px; margin-top: 12px; filter: grayscale(1) invert(var(--audio-inv, 0)); }
        [data-theme="dark"] { --audio-inv: 1; }

        #chat-box::-webkit-scrollbar { width: 6px; }
        #chat-box::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body data-theme="light">

<button class="menu-toggle" onclick="toggleSidebar()">☰</button>
<div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>

<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">AI Dictionary</div>
    <button class="sidebar-btn" onclick="newChat()">➕ New Chat</button>
    
    <div class="sidebar-header" style="font-size: 0.9rem; opacity: 0.6;">Search History</div>
    <div class="history-list" id="history-list"></div>
    
    <button class="sidebar-btn" onclick="clearHistory()" style="border-color: #ef4444; color: #ef4444;">🗑️ Clear History</button>

    <div class="dark-mode-row">
        Dark Mode
        <input type="checkbox" id="dark-toggle" style="width: 40px; height: 20px; cursor: pointer;">
    </div>
</aside>

<div class="chat-container">
    <header><h2>AI Dictionary</h2></header>
    <div id="chat-box">
        <div class="message-wrapper ai-message-wrapper">
            <div class="content-text">✨ Welcome! Ask me to define a word or show you how to use it in a sentence.</div>
            <button class="copy-btn" onclick="copyText(this)">📋 Copy</button>
        </div>
    </div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="e.g. How do you use mitigate?" autocomplete="off"/>
        <button id="send-btn">Search</button>
    </div>
</div>

<script>
// Sidebar & Theme Logic
function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('overlay').classList.toggle('active');
}

const darkToggle = document.getElementById('dark-toggle');
darkToggle.addEventListener('change', () => {
    const theme = darkToggle.checked ? 'dark' : 'light';
    document.body.setAttribute('data-theme', theme);
    localStorage.setItem('dictionary-theme', theme);
});

if (localStorage.getItem('dictionary-theme') === 'dark') {
    darkToggle.checked = true;
    document.body.setAttribute('data-theme', 'dark');
}

// Copy Text Logic
function copyText(btn) {
    const wrapper = btn.closest('.ai-message-wrapper');
    const text = wrapper.querySelector('.content-text').innerText;
    
    navigator.clipboard.writeText(text).then(() => {
        const originalHtml = btn.innerHTML;
        btn.innerHTML = '✅ Copied';
        btn.style.background = 'var(--accent)';
        btn.style.color = 'white';
        
        setTimeout(() => {
            btn.innerHTML = originalHtml;
            btn.style.background = '';
            btn.style.color = '';
        }, 2000);
    });
}

// History Logic
let searchHistory = JSON.parse(localStorage.getItem('lexi-history')) || [];

function updateHistoryUI() {
    const container = document.getElementById('history-list');
    container.innerHTML = '';
    searchHistory.slice().reverse().forEach(word => {
        const item = document.createElement('div');
        item.className = 'history-item';
        item.textContent = word;
        item.onclick = () => {
            toggleSidebar();
            document.getElementById('user-input').value = word;
            sendChat();
        };
        container.appendChild(item);
    });
}

function addToHistory(word) {
    if (!searchHistory.includes(word)) {
        searchHistory.push(word);
        if (searchHistory.length > 20) searchHistory.shift();
        localStorage.setItem('lexi-history', JSON.stringify(searchHistory));
        updateHistoryUI();
    }
}

function clearHistory() {
    searchHistory = [];
    localStorage.removeItem('lexi-history');
    updateHistoryUI();
}

function newChat() {
    document.getElementById('chat-box').innerHTML = `
        <div class="message-wrapper ai-message-wrapper">
            <div class="content-text">✨ Chat cleared! Ask me a new word.</div>
            <button class="copy-btn" onclick="copyText(this)">📋 Copy</button>
        </div>`;
    toggleSidebar();
}

// Dictionary Logic
function extractQueryInfo(query) {
    const lower = query.toLowerCase().trim();
    const patterns = [
        {type: 'pronunciation', regex: /(?:pronunciation of|how do you pronounce|pronounce) (\w+)/i},
        {type: 'example', regex: /(?:give me an example of|how do you use|use) (\w+)(?: in a sentence)?/i},
        {type: 'meaning', regex: /(?:what(?:['’]s| is)? the meaning of|define|what does) (\w+)(?: mean)?/i},
        {type: 'synonym', regex: /(?:synonym of|synonyms for) (\w+)/i},
        {type: 'antonym', regex: /(?:antonym of|antonyms for) (\w+)/i},
    ];
    for (let p of patterns) {
        const match = lower.match(p.regex);
        if (match) return {type: p.type, word: match[1]};
    }
    const words = lower.split(' ');
    if (words.length === 1 && words[0] !== "") return {type: 'meaning', word: words[0]};
    return {type: null, word: null};
}

async function handleUserInput(input) {
    const {type, word} = extractQueryInfo(input);
    if (!word) return `<div style="color: #ef4444">I couldn't detect a word. Try: "Define integrity"</div>`;
    addToHistory(word);

    try {
        const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
        const data = await response.json();
        if (data.title === "No Definitions Found") return `I couldn't find "${word}".`;

        const entry = data[0];
        let html = `<div><span class="type-tag">${type}</span><strong class="word-title">${word}</strong></div>`;

        if (type === 'example') {
            let found = false;
            entry.meanings.forEach(m => {
                const examples = m.definitions.filter(d => d.example).map(d => d.example);
                if (examples.length > 0) {
                    found = true;
                    html += `<details><summary>${m.partOfSpeech.toUpperCase()} <span>(${examples.length})</span></summary><div class="details-content">`;
                    examples.forEach(ex => html += `<div class="example-card">"${ex}"</div>`);
                    html += `</div></details>`;
                }
            });
            if (!found) html += `<p>No usage examples found.</p>`;
        } 
        else if (type === 'meaning') {
            entry.meanings.forEach(m => {
                html += `<details><summary>${m.partOfSpeech.toUpperCase()}</summary><div class="details-content">`;
                m.definitions.forEach((d, i) => {
                    html += `<p><strong>${i+1}.</strong> ${d.definition}</p>`;
                    if(d.example) html += `<div class="example-card">"${d.example}"</div>`;
                });
                html += `</div></details>`;
            });
        }
        else if (type === 'pronunciation') {
            const phonetics = entry.phonetics.map(p => p.text).filter(Boolean);
            html += `<div style="background:var(--input-bg); padding:16px; border-radius:12px; margin-top:10px; font-size: 1.1rem; border-left: 4px solid var(--primary);">📢 ${phonetics[0] || entry.phonetic || 'N/A'}`;
            const audioData = entry.phonetics.find(p => p.audio !== "");
            if (audioData) html += `<audio controls src="${audioData.audio}"></audio>`;
            html += `</div>`;
        }
        else {
            const list = entry.meanings.flatMap(m => m.definitions.flatMap(d => d[type + 's'] || []));
            const unique = [...new Set(list)];
            html += unique.length > 0 ? `<div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;">${unique.map(w => `<span style="background:var(--primary); color:white; padding:4px 10px; border-radius:20px; font-size:12px;">${w}</span>`).join('')}</div>` : `No results.`;
        }
        return html;
    } catch (err) {
        return `Error fetching data.`;
    }
}

async function sendChat() {
    const chatBox = document.getElementById("chat-box");
    const input = document.getElementById("user-input");
    const text = input.value.trim();
    if (!text) return;

    chatBox.innerHTML += `<div class="message-wrapper user-message-wrapper">${text}</div>`;
    input.value = "";
    chatBox.scrollTop = chatBox.scrollHeight;

    const response = await handleUserInput(text);
    
    // Create AI bubble structure with copy button
    const aiBubble = document.createElement('div');
    aiBubble.className = 'message-wrapper ai-message-wrapper';
    aiBubble.innerHTML = `
        <div class="content-text">${response}</div>
        <button class="copy-btn" onclick="copyText(this)">📋 Copy</button>
    `;
    
    chatBox.appendChild(aiBubble);
    chatBox.scrollTop = chatBox.scrollHeight;
}

document.getElementById("send-btn").addEventListener("click", sendChat);
document.getElementById("user-input").addEventListener("keypress", (e) => { if(e.key === "Enter") sendChat(); });
updateHistoryUI();
</script>
</body>
</html>
