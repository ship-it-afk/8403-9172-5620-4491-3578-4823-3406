<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASAS Office Standard Dashboard - V1</title>
    <style>
        :root {
            --bg-overlay: rgba(10, 10, 10, 0.75);
            --hover-bg: rgba(255, 255, 255, 0.12);
            --text-main: #ffffff;
            --text-secondary: #cccccc;
            --accent-blue: #0078d4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;

            /* Replace with your image path */
            background-image: linear-gradient(var(--bg-overlay), var(--bg-overlay)), 
                              url('https://images.unsplash.com/photo-1497215728101-856f4ea42174?auto=format&fit=crop&q=80&w=2070');
            background-size: cover;
            background-position: center;
        }

        /* Top Action Button */
        .top-nav {
            position: absolute;
            top: 40px;
            width: 100%;
            display: flex;
            justify-content: center;
            animation: fadeInDown 0.8s ease-out;
            z-index: 10;
        }

        .install-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .install-btn:hover {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0, 120, 212, 0.4);
        }

        .app-container {
            width: 100%;
            max-width: 900px;
            text-align: center;
            padding: 20px;
            animation: fadeInUp 0.8s ease-out;
        }

        /* Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 36px;
            font-weight: 300;
            margin-bottom: 50px;
            letter-spacing: -0.5px;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
            justify-items: center;
        }

        @media (max-width: 768px) {
            .app-grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 480px) {
            .app-grid { grid-template-columns: repeat(2, 1fr); }
        }

        .app-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 140px;
            padding: 25px 10px;
            border-radius: 16px;
            text-decoration: none;
            color: inherit;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            border: 1px solid transparent;
        }

        .app-card:hover {
            background-color: var(--hover-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transform: translateY(-8px);
            backdrop-filter: blur(12px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .app-logo {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
        }

        .app-name {
            font-size: 15px;
            font-weight: 400;
            color: var(--text-secondary);
            transition: color 0.3s;
        }

        .app-card:hover .app-name {
            color: white;
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <a href="morph.html" class="install-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            Install As App (Desktop / Android)
        </a>
    </div>

    <div class="app-container">
        <h1>Select An App (Web Version)</h1>
        
        <div class="app-grid">
            <a href="ASAS Writer.html" class="app-card">
                <img class="app-logo" src="images\writer.png" alt="Word">
                <span class="app-name">Writer</span>
            </a>

            <a href="ASAS Spreadsheet.html" class="app-card">
                <img class="app-logo" src="images\sheet.png" alt="Excel">
                <span class="app-name">Spreadsheet</span>
            </a>

            <a href="ASAS Presenter.html" class="app-card">
                <img class="app-logo" src="images\presenter.png" alt="PowerPoint">
                <span class="app-name">Presenter</span>
            </a>

            <a href="ASAS VidCall × WebRTC.html" class="app-card">
                <img class="app-logo" src="images\vidcall.png" alt="Teams">
                <span class="app-name">VidCall</span>
            </a>

            <a href="ASAS Notes.html" class="app-card">
                <img class="app-logo" src="images\note.png" alt="OneNote">
                <span class="app-name">Notes</span>
            </a>

            <a href="ASAS ScreenSaver.html" class="app-card">
                <img class="app-logo" src="images\screen.png" alt="Outlook">
                <span class="app-name">ScreenSaver</span>
            </a>

            <a href="Free AI Document Summarizer.html" class="app-card">
                <img class="app-logo" src="images\ai.png" alt="Copilot">
                <span class="app-name">AI Document Summarizer</span>
            </a>

            <a href="#" class="app-card">
                <img class="app-logo" src="images\draw.png" alt="Visio">
                <span class="app-name">Draw (Pre-Release)</span>
            </a>
        </div>
    </div>

</body>
</html>
