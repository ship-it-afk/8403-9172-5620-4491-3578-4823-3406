<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free URL Shortener</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --success: #10b981;
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --text: #f8fafc;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top left, #1e1b4b, #0f172a);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    /* Animated Background Blobs */
    .blob {
      position: absolute;
      width: 500px;
      height: 500px;
      background: var(--primary);
      filter: blur(80px);
      border-radius: 50%;
      z-index: -1;
      opacity: 0.15;
      animation: move 20s infinite alternate;
    }

    @keyframes move {
      from { transform: translate(-10%, -10%); }
      to { transform: translate(20%, 20%); }
    }

    .container {
      width: 100%;
      max-width: 400px;
      perspective: 1000px;
      padding: 20px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }

    h2 { margin: 0 0 10px; font-weight: 700; font-size: 28px; letter-spacing: -0.5px; }
    p { color: #94a3b8; margin-bottom: 30px; font-size: 14px; }

    .input-group {
      position: relative;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: white;
      font-size: 16px;
      box-sizing: border-box;
      transition: all 0.3s;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .btn-main { background: var(--primary); color: white; margin-top: 10px; }
    .btn-main:hover { background: var(--primary-hover); transform: translateY(-2px); }
    .btn-main:active { transform: translateY(0); }

    .btn-ghost {
      background: transparent;
      color: #94a3b8;
      margin-top: 20px;
      font-size: 13px;
    }
    .btn-ghost:hover { color: white; background: rgba(255,255,255,0.05); }

    #status {
      margin-top: 20px;
      font-size: 14px;
      height: 20px;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .loading-spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Success Animation */
    .success-pulse { color: var(--success) !important; animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: 0.5; } }

    .hidden { display: none; opacity: 0; transform: translateY(10px); }
    .visible { display: block; opacity: 1; transform: translateY(0); animation: fadeIn 0.4s forwards; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="blob"></div>

<div class="container">
  <div class="card" id="mainCard">
    <div id="searchView">
      <h2>Free URL Shortener</h2>
      <p>Enter your unique code to proceed</p>
      
      <div class="input-group">
        <input type="text" id="searchCode" placeholder="Access Code...">
      </div>
      
      <button class="btn-main" onclick="callGoogle('checkCode')">
        <span id="btnText">Continue</span>
        <div class="loading-spinner" id="spinner"></div>
      </button>
      
      <button class="btn-ghost" onclick="showCreate()">+ Shorten A URL</button>
    </div>

    <div id="createView" class="hidden">
      <h2>New Link</h2>
      <p>Configure your custom shortcut. Use 4 - 10 digit for custom code. </p>
      
      <input type="text" id="newCode" placeholder="Custom Code (e.g. PORTFOLIO)">
      <input type="url" id="newUrl" placeholder="Target URL (https://...)">
      
      <button class="btn-main" style="background: var(--success);" onclick="callGoogle('createOwnCode')">
        <span>Save Shortcut</span>
      </button>
      
      <button class="btn-ghost" onclick="showSearch()">← Back to Search</button>
    </div>

    <div id="status"></div>
  </div>
</div>

<script>
  const scriptURL = "https://script.google.com/macros/s/AKfycby1j0lgaiNTxf0npzfnDvl7m3olpwNwUlXxY8PF-CYoA_Zbw6ySQ5rOSNlZGp2XddQz7A/exec";

  function showCreate() {
    document.getElementById('searchView').classList.add('hidden');
    document.getElementById('searchView').classList.remove('visible');
    setTimeout(() => {
      document.getElementById('createView').classList.remove('hidden');
      document.getElementById('createView').classList.add('visible');
    }, 200);
  }

  function showSearch() {
    document.getElementById('createView').classList.add('hidden');
    document.getElementById('createView').classList.remove('visible');
    setTimeout(() => {
      document.getElementById('searchView').classList.remove('hidden');
      document.getElementById('searchView').classList.add('visible');
    }, 200);
  }

  function callGoogle(action) {
    const status = document.getElementById('status');
    const spinner = document.getElementById('spinner');
    const btnText = document.getElementById('btnText');
    
    status.style.opacity = "1";
    status.innerText = "Connecting to Cloud...";
    status.className = "";
    spinner.style.display = "block";
    if(btnText) btnText.style.opacity = "0.5";

    let finalUrl = scriptURL + "?callback=handleResponse&action=" + action;
    
    if (action === 'checkCode') {
      const code = document.getElementById('searchCode').value;
      if(!code) return resetUI("Please enter a code");
      finalUrl += "&code=" + encodeURIComponent(code);
    } 
    else {
      const code = document.getElementById('newCode').value;
      const url = document.getElementById('newUrl').value;
      if(!code || !url) return resetUI("Fill all fields");
      finalUrl += "&code=" + encodeURIComponent(code) + "&url=" + encodeURIComponent(url);
    }

    const oldScript = document.getElementById('jsonp-script');
    if (oldScript) oldScript.remove();
    const script = document.createElement('script');
    script.id = 'jsonp-script';
    script.src = finalUrl;
    document.body.appendChild(script);
  }

  function handleResponse(response) {
    const status = document.getElementById('status');
    resetUI("");

    if (response.url) {
      status.innerText = "Redirecting...";
      status.classList.add('success-pulse');
      window.location.href = response.url;
    } 
    else if (response.success && response.code) {
      status.innerText = "Link Created!";
      status.style.color = "#10b981";
      setTimeout(() => {
        alert("Shortcut '" + response.code + "' is now live.");
        showSearch();
      }, 500);
    } 
    else {
      status.innerText = response.message || "Code not found";
      status.style.color = "#ef4444";
    }
  }

  function resetUI(msg) {
    const status = document.getElementById('status');
    const spinner = document.getElementById('spinner');
    const btnText = document.getElementById('btnText');
    
    if(msg) status.innerText = msg;
    spinner.style.display = "none";
    if(btnText) btnText.style.opacity = "1";
  }
</script>

</body>
</html>
