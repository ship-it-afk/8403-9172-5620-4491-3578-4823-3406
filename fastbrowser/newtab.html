<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>New Tab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.65);
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-shine: rgba(255, 255, 255, 0.22);
            --liquid-blur: 50px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        input { user-select: text !important; }

        body {
            margin: 0; padding: 0; min-height: 100vh;
            background: #06070d;
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        /* 2026 Dynamic Deep Ambient Fluid Layer */
        #liquidCanvas {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 0;
            pointer-events: none;
            mix-blend-mode: screen;
            opacity: 0.9;
            filter: blur(var(--liquid-blur));
            transform: translateZ(0);
        }

        /* Premium True Liquid Glass Styling */
        .true-glass {
            background: var(--glass-bg);
            backdrop-filter: blur(40px) saturate(220%);
            -webkit-backdrop-filter: blur(40px) saturate(220%);
            border: 1px solid var(--glass-border);
            box-shadow: 
                0 10px 40px -10px rgba(0, 0, 0, 0.5),
                inset 0 1px 1px var(--glass-shine),
                inset 0 -1px 15px rgba(255, 255, 255, 0.01);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .true-glass:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.6),
                inset 0 1px 2px var(--glass-shine);
        }

        /* Structural Grid Custom Fitment */
        #shortcutGrid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
        }

        @media (max-width: 440px) {
            #shortcutGrid { 
                gap: 1rem; 
                max-width: 100%;
            }
        }

        /* Layout Node Wrapper Optimization */
        .shortcut-node {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            text-align: center;
            width: 100%;
            position: relative;
            animation: nodeSpawn 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes nodeSpawn {
            from { opacity: 0; transform: scale(0.9) translateY(15px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Micro-reflective container exclusively for the app icon */
        .shortcut-icon-container {
            width: 4.5rem;
            height: 4.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 1.5rem;
            position: relative;
            transform-style: preserve-3d;
            perspective: 800px;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @media (max-width: 440px) {
            .shortcut-icon-container {
                width: 3.8rem;
                height: 3.8rem;
                border-radius: 1.25rem;
            }
        }

        /* Title clean placement architecture underneath icon container */
        .shortcut-title {
            margin-top: 0.65rem;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.025em;
            color: var(--text-secondary);
            width: 100%;
            max-width: 84px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color 0.3s ease, transform 0.3s ease;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
        }

        .shortcut-node:hover .shortcut-title {
            color: var(--text-primary);
        }

        /* Search Engine Dynamic Elevation Wrapper */
        .search-wrapper:focus-within {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 
                0 30px 60px -15px rgba(0, 0, 0, 0.6),
                0 0 50px rgba(255, 255, 255, 0.08),
                inset 0 1px 2px rgba(255, 255, 255, 0.3);
            transform: translateY(-3px);
        }

        .suggestion-item.active {
            background: rgba(255, 255, 255, 0.14);
            padding-left: 2.25rem;
            color: #fff;
        }

        /* Intelligent Fluid Deletion Flags */
        .delete-btn {
            position: absolute; top: -5px; right: -2px; width: 22px; height: 22px;
            background: rgba(255, 65, 84, 0.95);
            backdrop-filter: blur(8px);
            border-radius: 50%; display: none;
            align-items: center; justify-content: center; font-size: 9px;
            color: white; z-index: 50; 
            box-shadow: 0 6px 15px rgba(255, 65, 84, 0.4);
            border: 1px solid rgba(255,255,255,0.2);
            transition: transform 0.2s ease;
        }
        .delete-btn:active { transform: scale(0.85); }

        .edit-mode .delete-btn { display: flex; }
        .edit-mode .shortcut-icon-container { animation: dynamicJiggle 0.3s infinite alternate ease-in-out; }

        @keyframes dynamicJiggle {
            0% { transform: rotate(-2.5deg) scale(0.96); }
            100% { transform: rotate(2.5deg) scale(0.96); }
        }

        /* Structural Glass Text Treatment */
        .glass-title-text {
            background: linear-gradient(180deg, #ffffff 40%, rgba(255,255,255,0.55) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.4));
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <canvas id="liquidCanvas"></canvas>

    <main class="flex-grow flex flex-col items-center justify-center p-6 z-10 relative mt-[-4vh] sm:mt-[-6vh]">
        
        <h1 class="text-5xl sm:text-6xl font-extrabold mb-10 tracking-tight glass-title-text select-none">
            FastBrowser
        </h1>

        <div class="relative w-full max-w-lg mb-12">
            <div class="true-glass search-wrapper flex items-center p-2 rounded-[2.25rem]">
                <div class="pl-4 pr-2 text-white/40">
                    <i class="fas fa-search text-base sm:text-lg"></i>
                </div>
                <input type="text" id="searchInput" placeholder="Search the web..." autocomplete="off"
                    class="bg-transparent w-full py-2.5 sm:py-3 outline-none text-base sm:text-lg text-white placeholder:text-white/30 font-medium">
                
                <button id="searchBtn" class="bg-white/10 hover:bg-white/20 active:scale-95 text-white px-5 sm:px-7 py-2.5 sm:py-3 rounded-[1.85rem] font-bold text-sm sm:text-base transition-all border border-white/5 ml-2 shadow-md">
                    Search
                </button>
            </div>
            
            <ul id="suggestions" class="absolute w-full mt-3 true-glass rounded-[2rem] overflow-hidden shadow-3xl z-50 hidden">
            </ul>
        </div>

        <div id="shortcutGrid" class="w-full"></div>

        <div class="flex gap-6 mt-12">
            <button id="openModal" aria-label="Append Application Shortcut" class="true-glass w-12 h-12 sm:w-14 sm:h-14 rounded-full flex items-center justify-center hover:scale-110 active:scale-90 text-white">
                <i class="fas fa-plus text-lg sm:text-xl"></i>
            </button>
            <button id="toggleEdit" aria-label="Toggle Layout Editor Mode" class="true-glass w-12 h-12 sm:w-14 sm:h-14 rounded-full flex items-center justify-center hover:scale-110 active:scale-90 text-white">
                <i class="fas fa-sliders-h text-lg sm:text-xl"></i>
            </button>
        </div>
    </main>

    <div id="modal" class="fixed inset-0 bg-black/60 backdrop-blur-2xl hidden items-center justify-center p-4 z-[100] transition-all duration-300">
        <div class="true-glass p-6 sm:p-8 rounded-[2.75rem] w-full max-w-sm border-white/10 scale-95 transition-transform duration-300 mx-auto" id="modalBox">
            <h2 class="text-xl font-bold mb-5 text-white text-center tracking-tight">Add Shortcuts</h2>
            <input type="text" id="siteName" placeholder="Shortcut Name" class="w-full p-4 mb-3 rounded-2xl bg-white/5 text-white outline-none border border-white/5 placeholder:text-white/20 focus:border-white/20 transition-colors">
            <input type="url" id="siteUrl" placeholder="Target URL (e.g. apple.com)" class="w-full p-4 mb-6 rounded-2xl bg-white/5 text-white outline-none border border-white/5 placeholder:text-white/20 focus:border-white/20 transition-colors">
            <div class="flex gap-3">
                <button id="closeModal" class="flex-1 py-4 text-white/50 hover:text-white font-semibold transition-colors rounded-2xl">Cancel</button>
                <button id="saveShortcut" class="flex-1 py-4 bg-white text-black hover:bg-white/90 rounded-2xl font-bold shadow-2xl transition-transform active:scale-95">Save</button>
            </div>
        </div>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const suggestionsBox = document.getElementById('suggestions');
        const grid = document.getElementById('shortcutGrid');
        const modal = document.getElementById('modal');
        const modalBox = document.getElementById('modalBox');
        let isEditMode = false;
        let selectedIndex = -1;

        // --- 2026 Generative Ambient Liquid Vector Field Engine ---
        const canvas = document.getElementById('liquidCanvas');
        const ctx = canvas.getContext('2d');
        let fluidNodes = [];
        const totalNodes = 7;

        function adaptCanvasBoundaries() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', adaptCanvasBoundaries);
        adaptCanvasBoundaries();

        class LiquidMass {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.radius = Math.random() * (canvas.width * 0.3) + (canvas.width * 0.15);
                this.vx = (Math.random() - 0.5) * 0.9;
                this.vy = (Math.random() - 0.5) * 0.9;
                this.color = fetchLiquidChromaProfile();
            }
            traverse() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < -this.radius) this.x = canvas.width + this.radius;
                if (this.x > canvas.width + this.radius) this.x = -this.radius;
                if (this.y < -this.radius) this.y = canvas.height + this.radius;
                if (this.y > canvas.height + this.radius) this.y = -this.radius;
            }
            render() {
                let gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
                gradient.addColorStop(0, this.color);
                gradient.addColorStop(1, 'transparent');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function fetchLiquidChromaProfile() {
            const hexMatrice = [
                'rgba(99, 102, 241, 0.22)',   // Glass Indigo
                'rgba(168, 85, 247, 0.18)',   // Electric Orchid
                'rgba(6, 182, 212, 0.15)',    // Deep Cyber Marine Cyan
                'rgba(236, 72, 153, 0.12)',   // Liquid Rubine Pink
                'rgba(45, 212, 191, 0.08)'    // Soft Aurora Mint Teal
            ];
            return hexMatrice[Math.floor(Math.random() * hexMatrice.length)];
        }

        function buildFluidField() {
            fluidNodes = [];
            for(let i=0; i<totalNodes; i++) fluidNodes.push(new LiquidMass());
        }

        function executeFluidAnimation() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#05060b'; // Core Infinite Horizon Base Value
            ctx.fillRect(0,0, canvas.width, canvas.height);
            
            fluidNodes.forEach(node => {
                node.traverse();
                node.render();
            });
            requestAnimationFrame(executeFluidAnimation);
        }
        buildFluidField();
        executeFluidAnimation();


        // --- Omnidirectional Query Logic ---
        const executeQueryTransfer = () => {
            const query = searchInput.value.trim();
            if (query) window.location.href = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
        };

        searchBtn.onclick = executeQueryTransfer;

        searchInput.onkeydown = (e) => {
            const items = suggestionsBox.querySelectorAll('li');
            if (e.key === 'Enter') {
                if (selectedIndex > -1 && items[selectedIndex]) {
                    searchInput.value = items[selectedIndex].dataset.val;
                    executeQueryTransfer();
                } else {
                    executeQueryTransfer();
                }
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                selectedIndex = Math.min(selectedIndex + 1, items.length - 1);
                refreshSelectionState(items);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                selectedIndex = Math.max(selectedIndex - 1, -1);
                refreshSelectionState(items);
            }
        };

        function refreshSelectionState(items) {
            items.forEach((item, i) => {
                item.classList.toggle('active', i === selectedIndex);
                if(i === selectedIndex) searchInput.value = item.dataset.val;
            });
        }

        searchInput.oninput = async () => {
            const val = searchInput.value;
            selectedIndex = -1;
            if (val.length < 2) { suggestionsBox.classList.add('hidden'); return; }
            
            try {
                const res = await fetch(`https://duckduckgo.com/ac/?q=${encodeURIComponent(val)}&type=list`);
                const data = await res.json();
                generateSuggestionsList(data[1]);
            } catch (e) { console.warn("Network response latency variance."); }
        };

        function generateSuggestionsList(list) {
            if (list.length === 0) { suggestionsBox.classList.add('hidden'); return; }
            suggestionsBox.innerHTML = list.slice(0, 5).map((item) => `
                <li class="suggestion-item p-4 cursor-pointer transition-all border-b border-white/5 last:border-0 flex items-center text-white/80 font-medium text-sm sm:text-base" 
                    data-val="${item.replace(/"/g, '&quot;')}"
                    onclick="selectSuggestion(this.dataset.val)">
                    <i class="fas fa-search mr-3 text-white/30 text-xs sm:text-sm"></i>
                    <span>${item}</span>
                </li>
            `).join('');
            suggestionsBox.classList.remove('hidden');
        }

        window.selectSuggestion = (val) => {
            searchInput.value = val;
            suggestionsBox.classList.add('hidden');
            executeQueryTransfer();
        };


        // --- Matrix Grid Persistent Shortcuts System ---
        let shortcuts = JSON.parse(localStorage.getItem('fb_pro_plus')) || [
            { name: 'Google', url: 'https://google.com' },
            { name: 'YouTube', url: 'https://youtube.com' },
            { name: 'GitHub', url: 'https://github.com' },
            { name: 'ChatGPT', url: 'https://chatgpt.com' }
        ];

        function renderShortcuts() {
            grid.innerHTML = '';
            shortcuts.forEach((s, i) => {
                let domain = '';
                try {
                    domain = new URL(s.url.startsWith('http') ? s.url : 'https://' + s.url).hostname;
                } catch(e) { domain = s.url; }
                
                const icon = `https://www.google.com/s2/favicons?sz=128&domain=${domain}`;
                
                const nodeContainer = document.createElement('div');
                nodeContainer.className = `shortcut-node ${isEditMode ? 'edit-mode' : ''}`;
                
                // Structural Fixment: App icon container built independently, title directly positioned below it
                nodeContainer.innerHTML = `
                    <button onclick="removeShortcut(${i})" class="delete-btn" aria-label="Purge Application Node"><i class="fas fa-times"></i></button>
                    <a href="${isEditMode ? '#' : s.url}" class="shortcut-icon-container true-glass shadow-xl" data-index="${i}">
                        <img src="${icon}" class="w-8 h-8 sm:w-9 sm:h-9 object-contain pointer-events-none" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(s.name)}&background=151622&color=fff'">
                    </a>
                    <span class="shortcut-title select-none">${s.name}</span>
                `;

                assignMorphicHardwareInteractions(nodeContainer);
                grid.appendChild(nodeContainer);
            });
        }

        // --- Native Long Press Engine and 3D Specular Parallax Module ---
        let systemPressTimer;
        function assignMorphicHardwareInteractions(node) {
            const entryPointsEditActivation = () => {
                if(!isEditMode) {
                    isEditMode = true;
                    document.getElementById('toggleEdit').classList.add('bg-white/20');
                    renderShortcuts();
                }
            };

            // Touch events processing for absolute cross-platform responsiveness
            node.addEventListener('touchstart', (e) => {
                systemPressTimer = setTimeout(entryPointsEditActivation, 750);
            }, {passive: true});

            node.addEventListener('touchend', () => clearTimeout(systemPressTimer));
            node.addEventListener('touchmove', () => clearTimeout(systemPressTimer));

            // Desktop 3D Hover Depth Parallax Vector Formula
            node.addEventListener('mousemove', (e) => {
                if(isEditMode) return;
                const container = node.querySelector('.shortcut-icon-container');
                const dimensions = container.getBoundingClientRect();
                const trackingX = e.clientX - dimensions.left - dimensions.width/2;
                const trackingY = e.clientY - dimensions.top - dimensions.height/2;
                container.style.transform = `perspective(200px) rotateX(${-trackingY * 0.16}deg) rotateY(${trackingX * 0.16}deg) scale(1.08)`;
            });

            node.addEventListener('mouseleave', () => {
                const container = node.querySelector('.shortcut-icon-container');
                if(container) container.style.transform = '';
            });
        }

        window.removeShortcut = (i) => {
            shortcuts.splice(i, 1);
            localStorage.setItem('fb_pro_plus', JSON.stringify(shortcuts));
            renderShortcuts();
        };

        document.getElementById('toggleEdit').onclick = () => {
            isEditMode = !isEditMode;
            document.getElementById('toggleEdit').classList.toggle('bg-white/20', isEditMode);
            renderShortcuts();
        };

        // Modal Custom Elastic Fluid Transitions Management
        const openModalBtn = document.getElementById('openModal');
        const closeModalBtn = document.getElementById('closeModal');
        
        openModalBtn.onclick = () => {
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => modalBox.classList.remove('scale-95'), 10);
        };
        
        const executeModalCloseSequence = () => {
            modalBox.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 150);
        };
        closeModalBtn.onclick = executeModalCloseSequence;
        
        document.getElementById('saveShortcut').onclick = () => {
            const name = document.getElementById('siteName').value.trim();
            let url = document.getElementById('siteUrl').value.trim();
            if (!name || !url) return;
            if (shortcuts.length >= 12) { return; }
            if (!url.startsWith('http')) url = 'https://' + url;
            
            shortcuts.push({ name, url });
            localStorage.setItem('fb_pro_plus', JSON.stringify(shortcuts));
            renderShortcuts();
            
            document.getElementById('siteName').value = '';
            document.getElementById('siteUrl').value = '';
            executeModalCloseSequence();
        };

        window.onclick = (e) => {
            if (e.target === modal) executeModalCloseSequence();
            if (!searchInput.contains(e.target) && !suggestionsBox.contains(e.target)) {
                suggestionsBox.classList.add('hidden');
            }
        };

        // Initialize Runtime Engine
        renderShortcuts();
    </script>
</body>
</html>
