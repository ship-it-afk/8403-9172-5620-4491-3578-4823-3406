<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>New Tab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --text: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.12);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        body {
            margin: 0; padding: 0; height: 100vh;
            background: #111;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text);
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
            transition: background-image 1s ease-in-out;
        }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
        }

        .search-wrapper:focus-within {
            background: rgba(255, 255, 255, 0.18);
            transform: scale(1.02);
        }

        #shortcutGrid {
            display: flex; flex-wrap: wrap; justify-content: center;
            gap: 1.5rem; max-width: 450px; margin: 0 auto;
        }

        .shortcut-item { width: 80px; animation: fadeIn 0.6s ease forwards; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .suggestion-item.active {
            background: rgba(255, 255, 255, 0.2);
            padding-left: 1.75rem;
        }

        .delete-btn {
            position: absolute; top: -5px; right: -5px; width: 22px; height: 22px;
            background: #ff4757; border-radius: 50%; display: none;
            align-items: center; justify-content: center; font-size: 10px;
            color: white; z-index: 10; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .edit-mode .delete-btn { display: flex; }
        .edit-mode .shortcut-link { animation: shake 0.3s infinite; }

        @keyframes shake {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(1.5deg); }
            75% { transform: rotate(-1.5deg); }
            100% { transform: rotate(0deg); }
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <main class="flex-grow flex flex-col items-center justify-center p-6 mt-[-5vh]">
        <h1 class="text-6xl font-extrabold mb-10 tracking-tighter text-white drop-shadow-2xl">
            FastBrowser
        </h1>

        <div class="relative w-full max-w-lg mb-12 group">
            <div class="glass search-wrapper flex items-center p-2 rounded-[2.5rem] shadow-2xl transition-all duration-300">
                <div class="pl-4 pr-2 text-white/50">
                    <i class="fas fa-search"></i>
                </div>
                <input type="text" id="searchInput" placeholder="Search Google..." autocomplete="off"
                    class="bg-transparent w-full py-3 outline-none text-lg text-white placeholder:text-white/50">
                
                <button id="searchBtn" class="bg-white/20 hover:bg-white/40 text-white px-6 py-3 rounded-[2rem] font-bold transition-all ml-2">
                    Search
                </button>
            </div>
            
            <ul id="suggestions" class="absolute w-full mt-3 glass rounded-[1.5rem] overflow-hidden shadow-2xl z-50 hidden">
                </ul>
        </div>

        <div id="shortcutGrid"></div>

        <div class="flex gap-6 mt-12">
            <button id="openModal" class="glass w-14 h-14 rounded-full flex items-center justify-center hover:scale-110 transition-transform text-white">
                <i class="fas fa-plus text-xl"></i>
            </button>
            <button id="toggleEdit" class="glass w-14 h-14 rounded-full flex items-center justify-center hover:scale-110 transition-transform text-white">
                <i class="fas fa-sliders-h text-xl"></i>
            </button>
        </div>
    </main>

    <div id="modal" class="fixed inset-0 bg-black/40 backdrop-blur-md hidden items-center justify-center p-6 z-[100]">
        <div class="glass p-8 rounded-[2.5rem] w-full max-w-xs border-white/20">
            <h2 class="text-xl font-bold mb-6 text-white text-center">Add Shortcut</h2>
            <input type="text" id="siteName" placeholder="Name" class="w-full p-4 mb-4 rounded-2xl bg-white/10 text-white outline-none border border-white/10">
            <input type="url" id="siteUrl" placeholder="URL (e.g. twitter.com)" class="w-full p-4 mb-6 rounded-2xl bg-white/10 text-white outline-none border border-white/10">
            <div class="flex gap-3">
                <button id="closeModal" class="flex-1 py-4 text-white/70 font-semibold">Cancel</button>
                <button id="saveShortcut" class="flex-1 py-4 bg-white text-black rounded-2xl font-bold">Add</button>
            </div>
        </div>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const suggestionsBox = document.getElementById('suggestions');
        const grid = document.getElementById('shortcutGrid');
        const modal = document.getElementById('modal');
        let isEditMode = false;
        let selectedIndex = -1;

        // --- Dynamic Wallpaper ---
        function setWallpaper() {
            const topics = ['minimal', 'abstract', 'dark-nature', 'galaxy', 'landscape'];
            const topic = topics[Math.floor(Math.random() * topics.length)];
            document.body.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://source.unsplash.com/featured/1920x1080?${topic}&sig=${Math.random()}')`;
        }

        // --- Search Logic ---
        const performSearch = () => {
            const query = searchInput.value.trim();
            if (query) window.location.href = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
        };

        searchBtn.onclick = performSearch;

        searchInput.onkeydown = (e) => {
            const items = suggestionsBox.querySelectorAll('li');
            if (e.key === 'Enter') {
                if (selectedIndex > -1 && items[selectedIndex]) {
                    searchInput.value = items[selectedIndex].textContent.trim();
                    performSearch();
                } else {
                    performSearch();
                }
            } else if (e.key === 'ArrowDown') {
                selectedIndex = Math.min(selectedIndex + 1, items.length - 1);
                updateSelection(items);
            } else if (e.key === 'ArrowUp') {
                selectedIndex = Math.max(selectedIndex - 1, -1);
                updateSelection(items);
            }
        };

        function updateSelection(items) {
            items.forEach((item, i) => {
                item.classList.toggle('active', i === selectedIndex);
            });
        }

        searchInput.oninput = async () => {
            const val = searchInput.value;
            selectedIndex = -1;
            if (val.length < 2) { suggestionsBox.classList.add('hidden'); return; }
            
            try {
                const res = await fetch(`https://duckduckgo.com/ac/?q=${val}&type=list`);
                const data = await res.json();
                renderSuggestions(data[1]);
            } catch (e) { console.warn("Suggestion fetch error"); }
        };

        function renderSuggestions(list) {
            if (list.length === 0) { suggestionsBox.classList.add('hidden'); return; }
            suggestionsBox.innerHTML = list.slice(0, 6).map((item, i) => `
                <li class="suggestion-item p-4 cursor-pointer transition-all border-b border-white/5 last:border-0 flex items-center text-white/90" 
                    onclick="selectSuggestion('${item.replace(/'/g, "\\'")}')">
                    <i class="fas fa-history mr-3 text-white/30 text-sm"></i>
                    ${item}
                </li>
            `).join('');
            suggestionsBox.classList.remove('hidden');
        }

        window.selectSuggestion = (val) => {
            searchInput.value = val;
            suggestionsBox.classList.add('hidden');
            performSearch();
        };

        // --- Shortcuts ---
        let shortcuts = JSON.parse(localStorage.getItem('fb_pro_plus')) || [
            { name: 'Google', url: 'https://google.com' },
            { name: 'YouTube', url: 'https://youtube.com' }
        ];

        function renderShortcuts() {
            grid.innerHTML = '';
            shortcuts.forEach((s, i) => {
                const domain = new URL(s.url.startsWith('http') ? s.url : 'https://' + s.url).hostname;
                const icon = `https://www.google.com/s2/favicons?sz=128&domain=${domain}`;
                
                const item = document.createElement('div');
                item.className = `shortcut-item relative flex flex-col items-center ${isEditMode ? 'edit-mode' : ''}`;
                item.innerHTML = `
                    <button onclick="removeShortcut(${i})" class="delete-btn"><i class="fas fa-times"></i></button>
                    <a href="${s.url}" class="shortcut-link w-16 h-16 glass rounded-[1.5rem] flex items-center justify-center mb-2 hover:scale-105 transition-transform shadow-xl">
                        <img src="${icon}" class="w-8 h-8 object-contain" onerror="this.src='https://ui-avatars.com/api/?name=${s.name}&background=random&color=fff'">
                    </a>
                    <span class="text-[11px] font-bold text-white text-center truncate w-full px-1 drop-shadow-md">${s.name}</span>
                `;
                grid.appendChild(item);
            });
        }

        function removeShortcut(i) {
            shortcuts.splice(i, 1);
            localStorage.setItem('fb_pro_plus', JSON.stringify(shortcuts));
            renderShortcuts();
        }

        document.getElementById('toggleEdit').onclick = () => {
            isEditMode = !isEditMode;
            document.getElementById('toggleEdit').classList.toggle('bg-white/40', isEditMode);
            renderShortcuts();
        };

        document.getElementById('openModal').onclick = () => modal.classList.remove('hidden');
        document.getElementById('closeModal').onclick = () => modal.classList.add('hidden');
        
        document.getElementById('saveShortcut').onclick = () => {
            const name = document.getElementById('siteName').value;
            let url = document.getElementById('siteUrl').value;
            if (!name || !url || shortcuts.length >= 8) return;
            if (!url.startsWith('http')) url = 'https://' + url;
            shortcuts.push({ name, url });
            localStorage.setItem('fb_pro_plus', JSON.stringify(shortcuts));
            renderShortcuts();
            modal.classList.add('hidden');
        };

        window.onclick = (e) => {
            if (e.target === modal) modal.classList.add('hidden');
            if (!searchInput.contains(e.target) && !suggestionsBox.contains(e.target)) {
                suggestionsBox.classList.add('hidden');
            }
        };

        setWallpaper();
        renderShortcuts();
    </script>
</body>
</html>
