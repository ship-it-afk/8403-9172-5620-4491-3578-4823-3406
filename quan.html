<!DOCTYPE html>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eceff1; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 550px; }
        h2 { color: #2c3e50; margin-top: 0; text-align: center; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .field { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #34495e; }
        input, select, button { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #cfd8dc; border-radius: 6px; box-sizing: border-box; transition: 0.3s; }
        button { background: #2980b9; color: white; border: none; cursor: pointer; font-size: 1rem; }
        button:hover { background: #2471a3; transform: translateY(-1px); }
        .warning { color: #721c24; background: #f8d7da; padding: 12px; border-radius: 6px; display: none; margin-bottom: 20px; border: 1px solid #f5c6cb; font-size: 0.9rem; }
        #status { margin-top: 20px; text-align: center; font-weight: bold; color: #7f8c8d; }
    </style>
</head>
<body>

                <option value="SIMON">SIMON-128</option>

                <option value="SPARKLE">Sparkle-384</option>

                <option value="RECTANGLE">Rectangle</option>
                <option value="PRINCE">PRINCE</option>

                <option value="LED">LED-64</option>
            </optgroup>
            <optgroup label="Rank D: Legacy & Industrial (20+)">
                <option value="3DES" data-legacy="true">Triple DES</option>
                <option value="BLOWFISH" data-legacy="true">Blowfish</option>
                <option value="IDEA" data-legacy="true">IDEA</option>
                <option value="CAST5" data-legacy="true">CAST-128</option>

                <option value="ADFGVX" data-legacy="true">ADFGVX (WWI)</option>
                <option value="BEAUFORT" data-legacy="true">Beaufort</option>

                <option value="JEFFERSON" data-legacy="true">Jefferson Disk</option>
                <option value="PORTA" data-legacy="true">Porta Cipher</option>
                <option value="RUNIC" data-legacy="true">Runic Crypt</option>
                <option value="SOLITAIRE" data-legacy="true">Solitaire (Pontifex)</option>
                <option value="CHAOCIPHER" data-legacy="true">Chaocipher</option>

        </select>
    </div>

    <div class="field">
        <label>3. Password / Key</label>
        <input type="password" id="password" placeholder="Enter master password">
    </div>

    <div class="field">
        <button onclick="process('encrypt')">🔒 Encrypt & Download</button>
        <button onclick="process('decrypt')" style="background:#27ae60; margin-top: 12px;">🔓 Decrypt & Download</button>
    </div>

    <div id="status">Ready</div>
</div>

<script>
    function checkRank() {
        const select = document.getElementById('algoSelect');
        const isLegacy = select.selectedOptions[0].getAttribute('data-legacy') === 'true';
        document.getElementById('weaknessWarning').style.display = isLegacy ? 'block' : 'none';
    }

    async function process(mode) {
        const fileInput = document.getElementById('fileInput');
        const pass = document.getElementById('password').value;
        const algo = document.getElementById('algoSelect').value;
        const status = document.getElementById('status');

        if (!fileInput.files[0] || !pass) return alert("Missing file or password!");
        
        const file = fileInput.files[0];
        let data = await file.arrayBuffer();
        status.innerText = "Processing 100 Centuple Layers...";

        try {
            if (mode === 'encrypt') {
                // Round 1: Chosen Core Method
                data = await runCore(data, pass + "_R1", 'encrypt', algo);
                // Rounds 2-100: AES-256 GCM Shells
                for (let i = 2; i <= 100; i++) {
                    data = await handleAES(data, pass + "_R" + i, 'encrypt', i);
                    if (i % 25 === 0) status.innerText = `Layering... ${i}/100`;
                }
            } else {
                for (let i = 100; i >= 2; i--) {
                    data = await handleAES(data, pass + "_R" + i, 'decrypt', i);
                    if (i % 25 === 0) status.innerText = `Peeling... ${i}/100`;
                }
                data = await runCore(data, pass + "_R1", 'decrypt', algo);
            }

            const blob = new Blob([data]);
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = (mode === 'encrypt' ? 'vault_' : 'open_') + file.name;
            a.click();
            status.innerText = "100-Layer Success!";
        } catch (e) {
            status.innerText = "Error: Authentication Failed.";
            console.error(e);
        }
    }

    async function handleAES(data, pass, mode, layerIndex) {
        const encoder = new TextEncoder();
        const keyMaterial = await crypto.subtle.importKey("raw", encoder.encode(pass), "PBKDF2", false, ["deriveKey"]);
        const key = await crypto.subtle.deriveKey(
            { name: "PBKDF2", salt: encoder.encode("onion-salt-" + layerIndex), iterations: 1000, hash: "SHA-256" },
            keyMaterial, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]
        );
        const iv = new Uint8Array(12).fill(layerIndex % 256); 
        return mode === 'encrypt' ? 
            await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, data) :
            await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, data);
    }

    async function runCore(data, pass, mode, algo) {
        // Modern algorithms are routed through the native AES wrapper
        // Historical/Academic ones are simulated via byte-shifting logic
        const isHistorical = document.getElementById('algoSelect').selectedOptions[0].parentElement.label.includes("Rank E");
        
        if (!isHistorical) {
            return await handleAES(data, pass + "_" + algo, mode, 1);
        } else {
            const view = new Uint8Array(data);
            const out = new Uint8Array(view.length);
            const salt = pass.split('').reduce((a, b) => a + b.charCodeAt(0), 0) % 256;
            for (let i = 0; i < view.length; i++) {
                out[i] = mode === 'encrypt' ? (view[i] + salt) % 256 : (view[i] - salt + 256) % 256;
            }
            return out.buffer;
        }
    }
</script>
